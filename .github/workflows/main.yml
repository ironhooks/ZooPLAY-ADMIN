name: ZooPLAY Secure APK Builder

on:
  workflow_dispatch:
    inputs:
      google_drive_url:
        description: "Google Drive ZIP Source URL"
        required: true
        type: string

      release_tag:
        description: "GitHub Release Tag"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: zooplay-release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and Sign ZooPLAY
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Download Tool
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Download Source ZIP
        env:
          DRIVE_URL: ${{ inputs.google_drive_url }}
        run: |
          set -euo pipefail

          test -n "$DRIVE_URL"

          gdown "$DRIVE_URL" -O source.zip

          test -s source.zip

          unzip -tq source.zip

      - name: Extract Source
        run: |
          set -euo pipefail

          mkdir -p source
          unzip -q source.zip -d source

      - name: Locate Android Project
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find source -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "App Gradle file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Prepare and Verify Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Signing secrets missing"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/zooplay-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          CERT_SHA256=$(keytool -exportcert \
            -keystore "$KEYSTORE" \
            -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD \
            | sha256sum | awk '{print $1}')

          test -n "$CERT_SHA256"

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

          echo "Keystore verified successfully"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CERT_SHA256: ${{ env.CERT_SHA256 }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -s "$KEYSTORE_PATH"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          $GRADLE_CMD \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            assembleRelease \
            -PcertSha256="$CERT_SHA256"

      - name: Locate Release APK
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            | sort | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          mkdir -p signed

          cp "$APK" signed/ZooPLAY-release.apk

          test -s signed/ZooPLAY-release.apk

      - name: Verify APK Signature
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            signed/ZooPLAY-release.apk

          ACTUAL_CERT=$("$APKSIGNER" verify \
            --print-certs signed/ZooPLAY-release.apk \
            | sed -n \
            's/.*certificate SHA-256 digest: //p' \
            | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')

          EXPECTED_CERT=$(printf '%s' "$CERT_SHA256" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')

          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "ERROR: Certificate fingerprint mismatch"
            exit 1
          fi

          echo "APK signature verified successfully"

      - name: Generate SHA256 Checksum
        run: |
          set -euo pipefail

          cd signed

          sha256sum ZooPLAY-release.apk > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Remove Temporary Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/zooplay-release.jks"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZooPLAY-Signed-Release
          path: |
            signed/ZooPLAY-release.apk
            signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Signed APK
        uses: actions/download-artifact@v4
        with:
          name: ZooPLAY-Signed-Release
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.release_tag }}
          name: ZooPLAY Release ${{ inputs.release_tag }}
          body: |
            ZooPLAY Secure Release Build

            Build Type: Release APK
            Java: 17
            Gradle: 8.9
            Android SDK: 35

            APK Signing: Enabled
            Signature Verification: Passed
            SHA256 Checksum: Included

            Built with GitHub Actions.
          files: |
            release/ZooPLAY-release.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
